# Docker Compose override for CUDA 12.6
# Use this for Windows 11 with NVIDIA driver 551+ or Linux driver 550+
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.cuda126.yml up -d
#
# Or set environment variable:
#   export NEXTPLAID_IMAGE=next-plaid-api:cuda-12.6
#   docker-compose up -d

services:
  nextplaid-gpu:
    image: next-plaid-api:cuda-12.6
    # Remove deploy.resources for custom built image
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
